<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="panel" class="hidden">
        <div class="panel-header">
            <h2>Weed Control Panel</h2>
            <button id="closeBtn" class="close-btn">&times;</button>
        </div>
        <div class="panel-body">
            <div class="section">
                <h3>Props</h3>
                <div id="propList" class="prop-list"></div>
            </div>
            <div class="section" id="editSection" style="display:none;">
                <h3>Edit: <span id="editLabel"></span></h3>
                <div class="form-group">
                    <label>Growth Stage</label>
                    <select id="stageSelect">
                        <option value="0">Empty Pot</option>
                        <option value="1">Small</option>
                        <option value="2">Medium</option>
                        <option value="3">Large (Full)</option>
                    </select>
                    <button id="applyStage" class="btn">Apply Stage</button>
                </div>
                <div class="form-group">
                    <label>Position (X, Y, Z)</label>
                    <div class="coord-row">
                        <input type="number" id="coordX" step="0.1">
                        <input type="number" id="coordY" step="0.1">
                        <input type="number" id="coordZ" step="0.1">
                    </div>
                    <label>Heading</label>
                    <input type="number" id="heading" step="1">
                    <button id="applyMove" class="btn">Move Prop</button>
                </div>
                <button id="deleteBtn" class="btn btn-danger">Delete Prop</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
